name: Tuning And Schema CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tuning-schema-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tuning and schema tests
        env:
          PYTHONPATH: src
        run: |
          poetry run python -m unittest \
            tests.test_tuning_score_adapter_profiles \
            tests.test_schema_contract_alignment \
            tests.test_baml_schema_fragment_sync \
            tests.test_baml_type_contract_alignment \
            tests.test_table22_v13_contract_roundtrip
