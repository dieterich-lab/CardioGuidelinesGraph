[tool.poetry]
name = "cardio-guidelines-graph"
version = "0.1.0"
description = "A project for knowledge graph construction from German cardiovascular guidelines"
authors = ["pwiesenbach <pwiesenbach@example.com>"]
readme = "README.md"
repository = "https://github.com/dieterich-lab/CardioGuidelinesGraph"
packages = [{include = "cardio_graph", from = "src"}]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# Core dependencies
neo4j = "^5.14.0"
python-dotenv = "^1.0.0"
click = "^8.1.7"
langchain = ">=0.1.0,<0.2.0"
langchain-core = ">=0.1.28,<0.2.0"
langchain-text-splitters = ">=0.0.1,<0.1.0"
langchain-community = ">=0.0.21,<0.1.0"
langsmith = ">=0.1.0,<0.2.0"
ollama = "^0.1.7"

# PDF processing
pypdf2 = "^3.0.1"
pypdf = "^3.15.1"  # Used by parse_pdf_as_markdown.py
pymupdf = "^1.23.7"  # Better PDF extraction with tables support
pymupdf4llm = "*"  # Markdown conversion for LLM-focused workflows
pdfplumber = "^0.10.3"  # PDF data extraction focused on tables
docling = "^0.4.0"
pdf2image = "^1.16.3"
pillow = "^10.2.0"
tqdm = "^4.66.1"  # Progress bar utility
tabulate = "^0.9.0"  # Table formatting for markdown

# Data processing and analysis
numpy = "^1.26.3"
pandas = "^2.1.4"
matplotlib = "^3.8.2"
networkx = "^3.2.1"
scikit-learn = "^1.3.2"

# BAML client dependencies
pydantic = "^2.5.3"
typing-extensions = "^4.9.0"
aiohttp = "^3.9.1"
requests = "^2.31.0"

# Jupyter notebooks support
jupyter = "^1.0.0"
ipykernel = "^6.27.1"
baml-py = "0.217.0"
mysql-connector-python = "^9.4.0"
rdflib = "^7.0.0"
sqlalchemy = "^2.0.43"
pymysql = "^1.1.1"
spacy = "^3.7.0"
whoosh = "^2.7.4"
scispacy = "^0.5.4"
docling-ibm-models = {version = "0.2.0", extras = ["all"]}
psycopg2-binary = "^2.9.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.2"
flake8 = "^6.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"

[tool.poetry.scripts]
parse-pdfs = "cardio_graph.parsing_utils.parse_pdfs_with_docling:cli"
parse-structures = "cardio_graph.extraction_utils.parse_structures_from_markdown_or_pdfs:cli"
split-pages = "cardio_graph.parsing_utils.split_pages:cli"
pdf-to-markdown = "cardio_graph.parsing_utils.parse_pdf_as_markdown:main"
feed-neo4j = "cardio_graph.neo4j_utils.feedneo4jdb:main"
extract = "cardio_graph.extraction_utils.extract:main"
generate-graph = "cardio_graph.extraction_utils.generate_graph:main"
v2-generate-graph = "cardio_graph.extraction_utils.new_graph_construction:main"
query = "cardio_graph.extraction_utils.query_interpreter:main"
run-ollama = "cardio_graph.ollama_utils.runollama:main"
snomed-explorer = "cardio_graph.snomedct_utils.snomed_query:main"
generate-cardio-ontology = "cardio_graph.snomedct_utils.generate_cardio_ontology:main"
ground-entities = "cardio_graph.extraction_utils.entity_grounding_service:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=cardio_graph"
