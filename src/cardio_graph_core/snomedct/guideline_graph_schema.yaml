project_name: "CardioGuidelinesGraph"
version: "2.0.0"
description: "Hybrid Ontology for Cardiology Guidelines combining Semantic Medical Entities with Guideline Decision Logic."

# ==========================================
# 1. NODE LABELS (The "Classes")
# ==========================================
nodes:
  # --- A. Semantic Layer (The Vocabulary) ---
  # Diese Knoten repräsentieren "Wissen" und werden auf SNOMED CT gemappt.
  # Sie sind die "Anker" für den Patienten-Input.

  - label: "ClinicalCondition"
    description: "Diseases, syndromes, or symptoms."
    attributes:
      - name: "name"
        type: "string"
        description: "Official name"
      - name: "snomed_id"
        type: "string"
        description: "SCTID from SNOMED CT"
      - name: "preferred_term"
        type: "string"
        description: "Preferred SNOMED term (often FSN depending on data source)."
      - name: "synonyms"
        type: "list"
      - name: "alt_names"
        type: "list"
        description: "Alternative active descriptions from SNOMED."
      - name: "entity"
        type: "string"
        description: "Canonical extracted surface form used in pipeline."
      - name: "entity_original"
        type: "string"
        description: "Original text span from guideline extraction."
      - name: "entity_standardized_candidate"
        type: "string"
        description: "LLM standardized candidate prior to SNOMED grounding."
      - name: "target_label"
        type: "string"
      - name: "taxonomy_path"
        type: "list"
      - name: "root_concept_id"
        type: "string"
      - name: "root_concept_term"
        type: "string"

  - label: "Medication"
    description: "Drug substances or drug classes."
    attributes:
      - name: "name"
        type: "string"
      - name: "snomed_id"
        type: "string"
      - name: "preferred_term"
        type: "string"
      - name: "synonyms"
        type: "list"
      - name: "alt_names"
        type: "list"
      - name: "entity"
        type: "string"
      - name: "entity_original"
        type: "string"
      - name: "entity_standardized_candidate"
        type: "string"
      - name: "target_label"
        type: "string"
      - name: "taxonomy_path"
        type: "list"
      - name: "root_concept_id"
        type: "string"
      - name: "root_concept_term"
        type: "string"
      - name: "drug_class"
        type: "boolean" # True = ACE-Inhibitor (Class), False = Ramipril (Substance)

  - label: "ClinicalParameter"
    description: "Measurable entities (e.g., Blood Pressure, LVEF, Potassium Level)."
    attributes:
      - name: "name"
        type: "string"
      - name: "snomed_id"
        type: "string"
      - name: "preferred_term"
        type: "string"
      - name: "synonyms"
        type: "list"
      - name: "alt_names"
        type: "list"
      - name: "entity"
        type: "string"
      - name: "entity_original"
        type: "string"
      - name: "entity_standardized_candidate"
        type: "string"
      - name: "target_label"
        type: "string"
      - name: "taxonomy_path"
        type: "list"
      - name: "root_concept_id"
        type: "string"
      - name: "root_concept_term"
        type: "string"
      - name: "unit"
        type: "string" # e.g., "mmHg", "%", "mmol/L"

  - label: "Procedure"
    description: "Diagnostic or therapeutic procedures (e.g., PCI, ECG, Echo)."
    attributes:
      - name: "name"
        type: "string"
      - name: "snomed_id"
        type: "string"
      - name: "preferred_term"
        type: "string"
      - name: "synonyms"
        type: "list"
      - name: "alt_names"
        type: "list"
      - name: "entity"
        type: "string"
      - name: "entity_original"
        type: "string"
      - name: "entity_standardized_candidate"
        type: "string"
      - name: "target_label"
        type: "string"
      - name: "taxonomy_path"
        type: "list"
      - name: "root_concept_id"
        type: "string"
      - name: "root_concept_term"
        type: "string"

  # --- B. Logic Layer (The Guideline Structure) ---
  # Diese Knoten bilden den Entscheidungsbaum/DAG ab.
  # Sie werden NICHT zwingend auf SNOMED gemappt, sondern strukturieren den Ablauf.

  - label: "GuidelineSource"
    description: "Metadata about the source document (e.g., ESC 2021 Heart Failure)."
    attributes:
      - name: "title"
        type: "string"
      - name: "year"
        type: "integer"
      - name: "section"
        type: "string" # e.g., "Table 5" or "Section 3.2"

  - label: "DecisionNode"
    description: "A logical fork in the road. Represents a check against a parameter or condition."
    attributes:
      - name: "question"
        type: "string" # e.g., "Is LVEF < 40%?"
      - name: "operator"
        type: "string" # e.g., "<", ">", "=", "PRESENT", "ABSENT", "PLANNED"
      - name: "threshold_value"
        type: "float"  # e.g., 40.0
      - name: "unit"
        type: "string"
      - name: "condition_context"
        type: "string"
      - name: "logic_type"
        type: "string" # "AND", "OR", "null"
      - name: "entity"
        type: "string"
      - name: "entity_original"
        type: "string"
      - name: "entity_standardized_candidate"
        type: "string"

  - label: "RecommendationNode"
    description: "The specific clinical instruction derived from the guideline."
    attributes:
      - name: "class_of_recommendation"
        type: "string" # "I", "IIa", "IIb", "III"
      - name: "level_of_evidence"
        type: "string" # "A", "B", "C"
      - name: "direction"
        type: "string" # "POSITIVE", "NEGATIVE", "UNKNOWN"
      - name: "full_text"
        type: "string" # The exact sentence from the PDF
      - name: "recommendation_type"
        type: "string" # "PRESCRIPTION", "DIAGNOSIS", "LIFESTYLE"
      - name: "source"
        type: "string"
      - name: "original_rule_id"
        type: "string"


# ==========================================
# 2. RELATIONSHIPS (The "Edges")
# ==========================================
relationships:
  # --- Logic Flow (The "Algorithm") ---
  
  - type: "EVALUATES"
    source: "DecisionNode"
    target: "ClinicalParameter"
    description: "Links the logic check to the semantic concept (e.g., Check -> LVEF)."

  - type: "CHECKS_FOR"
    source: "DecisionNode"
    target: "ClinicalCondition"
    description: "Checks for presence of a disease (e.g., Check -> Diabetes)."

  - type: "LEADS_TO"
    source: "DecisionNode"
    target: "DecisionNode"
    description: "Connecting logic steps (if yes -> go to next check)."
    properties:
      - name: "condition_met"
        type: "boolean" # True (YES path) or False (NO path)

  - type: "RESULTS_IN"
    source: "DecisionNode"
    target: "RecommendationNode"
    description: "The outcome of a decision path."
    properties:
      - name: "condition_met"
        type: "boolean"

  # --- Action Mapping (Connecting Logic to Reality) ---

  - type: "RECOMMENDS_USAGE"
    source: "RecommendationNode"
    target: "Medication"
    description: "Positive recommendation (Class I/II)."

  - type: "CONTRAINDICATES"
    source: "RecommendationNode"
    target: "Medication"
    description: "Negative recommendation (Class III)."

  - type: "RECOMMENDS_PROCEDURE"
    source: "RecommendationNode"
    target: "Procedure"

  # --- Context & Grounding ---

  - type: "MENTIONED_IN"
    source: "RecommendationNode" # or DecisionNode
    target: "GuidelineSource"
    description: "Traceability back to the PDF source."


# ==========================================
# 3. SNOMED INTEGRATION & TAXONOMY
# ==========================================
# Hier definieren wir, wie wir SNOMED-Hierarchien nutzen, 
# um unseren Knoten automatisch Labels zu geben.

snomed_mapping:
  import_hierarchy: true   # JA, wir wollen IS_A Relationen importieren!
  
  # Wenn ein Begriff unterhalb dieses SNOMED-Concepts liegt, 
  # bekommt er automatisch das Label "Medication"
  mapping_rules:
    - target_label: "Medication"
      root_concepts: 
        - "105590001" # Substance
        - "373873005" # Pharmaceutical / biologic product (product)
        - "373247007" # Cardiovascular agent (substance)
        - "410942007" # Drug or medicament (substance)
      
    - target_label: "ClinicalCondition"
      root_concepts:
        - "49601007"  # Disorder of cardiovascular system
        - "404684003" # Clinical finding (für Symptome)

    - target_label: "Procedure"
      root_concepts:
        - "71388002"  # Procedure

    - target_label: "ClinicalParameter"
      root_concepts:
        - "363787002" # Observable entity (z.B. Blood Pressure)


# ==========================================
# 4. EXTRACTION CONTRACT (Single Source of Truth)
# ==========================================
# This section defines the extraction-side subset and naming contract.
# The BAML schema MUST remain a subset of this contract.
extraction_contract:
  version: "1.0"
  source_of_truth: "guideline_graph_schema.yaml"
  baml_file: "src/cardio_graph_core/extraction/baml_src/extract_concepts.baml"

  roles:
    condition_side: ["Condition", "ClinicalParameter", "Procedure"]
    action_side: ["Medication", "Procedure"]

  required_origin_fields:
    - "entity_original"
    - "entity_standardized_candidate"

  derived_origin_fields:
    - name: "entity"
      derivation: "entity_standardized_candidate || entity_original"

  condition_logic_fields:
    operator:
      allowed: ["<", ">", "<=", ">=", "=", "PRESENT", "ABSENT", "PLANNED"]
    threshold:
      maps_to_graph_attribute: "threshold_value"
    unit:
      maps_to_graph_attribute: "unit"
    condition_context:
      maps_to_graph_attribute: "condition_context"
    logic_type:
      allowed: ["AND", "OR", null]
    logic_group:
      type: "string"

  recommendation_fields:
    strength:
      maps_to_graph_attribute: "class_of_recommendation"
    level:
      maps_to_graph_attribute: "level_of_evidence"
    direction:
      allowed: ["POSITIVE", "NEGATIVE", "UNKNOWN"]

  grounding_fields:
    - "snomed_id"
    - "preferred_term"
    - "synonyms"
    - "alt_names"
    - "target_label"
    - "taxonomy_path"
    - "root_concept_id"
    - "root_concept_term"