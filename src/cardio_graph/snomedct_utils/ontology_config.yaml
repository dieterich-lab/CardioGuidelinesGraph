# Configuration for the Cardio Ontology Generator
# This file defines the T-Box (schema) and parameters for the A-Box (data) population.

# Broad search terms for extracting cardiovascular concepts from SNOMED CT
# These terms are used to find ALL relevant concepts, then create ontology classes directly
cardiovascular_search_terms:
  - "heart"
  - "cardiac"
  - "cardiovascular"
  - "coronary"
  - "myocardial"
  - "atrial"
  - "ventricular"
  - "valve"
  - "arrhythmia"
  - "hypertension"
  - "stroke"
  - "embolism"
  - "aneurysm"
  - "angina"
  - "ischemia"
  - "infarction"
  - "failure"
  - "cardiomyopathy"
  - "pericard"
  - "endocard"
  - "vascular"
  - "artery"
  - "vein"
  - "blood pressure"
  - "cholesterol"
  - "lipid"
  - "diabetes"
  - "obesity"
  - "smoking"
  - "exercise"
  - "rehabilitation"
  - "beta blocker"
  - "ACE inhibitor"
  - "statin"
  - "anticoagulant"
  - "antiplatelet"
  - "diuretic"
  - "echocardiography"
  - "angiography"
  - "catheterization"
  - "pacemaker"
  - "defibrillator"
  - "transplant"
  - "depression"
  - "anxiety"
  - "mortality"
  - "death"
  # Specific clinical acronyms and terms
  - "HFrEF"
  - "HFpEF"
  - "LVEF"
  - "ejection fraction"
  - "NYHA"
  - "ACC/AHA"
  - "ESC"
  - "STEMI"
  - "NSTEMI"
  - "PCI"
  - "CABG"
  - "TAVR"
  - "ICD"
  - "CRT"
  - "AF"
  - "atrial fibrillation"
  - "VT"
  - "ventricular tachycardia"
  - "VF"
  - "ventricular fibrillation"
  - "ACS"
  - "acute coronary syndrome"
  # Key concepts with common abbreviations
  - "heart failure"
  - "coronary artery disease"
  - "myocardial infarction"
  - "major adverse cardiovascular events"

# This section defines the core schema (T-Box) of the ontology.
# Focused on cardiovascular concepts that entities from text can ground to.
# SNOMED CT concepts will be added as subclasses of these core classes.
core_classes:
  # --- Core Cardiovascular Conditions ---
  - name: CardiovascularDisease
    description: Diseases affecting the heart and blood vessels.
  - name: HeartDisease
    description: Diseases of the heart.
    subclass_of: CardiovascularDisease
  - name: HeartFailure
    description: Heart failure conditions.
    subclass_of: HeartDisease
    snomed_search_terms:
      - HF
      - heart failure
      - cardiac failure
  - name: CoronaryArteryDisease
    description: Diseases of the coronary arteries.
    subclass_of: HeartDisease
  - name: Arrhythmia
    description: Abnormal heart rhythms.
    subclass_of: HeartDisease
  - name: ValvularHeartDisease
    description: Diseases of the heart valves.
    subclass_of: HeartDisease
  - name: Cardiomyopathy
    description: Diseases of the heart muscle.
    subclass_of: HeartDisease
  - name: Hypertension
    description: High blood pressure.
    subclass_of: CardiovascularDisease
  - name: Stroke
    description: Cerebrovascular accidents.
    subclass_of: CardiovascularDisease
  - name: PeripheralArteryDisease
    description: Diseases of peripheral arteries.
    subclass_of: CardiovascularDisease

  # --- Cardiovascular Procedures and Interventions ---
  - name: CardiacProcedure
    description: Procedures performed on the heart.
  - name: CardiacImaging
    description: Imaging procedures for the heart.
    subclass_of: CardiacProcedure
  - name: CardiacCatheterization
    description: Catheter-based cardiac procedures.
    subclass_of: CardiacProcedure
  - name: CardiacSurgery
    description: Surgical procedures on the heart.
    subclass_of: CardiacProcedure
  - name: CardiacDeviceImplantation
    description: Implantation of cardiac devices.
    subclass_of: CardiacProcedure

  # --- Medications and Therapies ---
  - name: CardiovascularMedication
    description: Medications used for cardiovascular conditions.
  - name: Antihypertensive
    description: Medications to treat hypertension.
    subclass_of: CardiovascularMedication
  - name: Antiarrhythmic
    description: Medications to treat arrhythmias.
    subclass_of: CardiovascularMedication
  - name: Anticoagulant
    description: Blood thinning medications.
    subclass_of: CardiovascularMedication
  - name: Antiplatelet
    description: Platelet inhibiting medications.
    subclass_of: CardiovascularMedication
  - name: LipidLoweringAgent
    description: Medications to lower lipid levels.
    subclass_of: CardiovascularMedication
  - name: HeartFailureMedication
    description: Medications specifically for heart failure.
    subclass_of: CardiovascularMedication

  # --- Risk Factors and Biomarkers ---
  - name: CardiovascularRiskFactor
    description: Factors that increase cardiovascular risk.
  - name: CardiacBiomarker
    description: Laboratory markers for cardiac conditions.
  - name: CardiovascularSymptom
    description: Symptoms of cardiovascular conditions.

  # --- Outcomes and Events ---
  - name: CardiovascularEvent
    description: Cardiovascular events and outcomes.
  - name: Mortality
    description: Death-related outcomes.
    subclass_of: CardiovascularEvent

# This section defines the Object Properties (relationships) of the ontology.
core_properties:
  # --- Cardiovascular Relationships ---
  - name: hasRiskFactor
    domain: CardiovascularDisease
    range: CardiovascularRiskFactor
    description: Links a cardiovascular disease to its risk factors.
  - name: hasSymptom
    domain: CardiovascularDisease
    range: CardiovascularSymptom
    description: Links a cardiovascular disease to its symptoms.
  - name: hasBiomarker
    domain: CardiovascularDisease
    range: CardiacBiomarker
    description: Links a cardiovascular disease to relevant biomarkers.
  - name: treatedBy
    domain: CardiovascularDisease
    range: CardiovascularMedication
    description: Links a disease to medications that treat it.
  - name: treatedBy
    domain: CardiovascularDisease
    range: CardiacProcedure
    description: Links a disease to procedures that treat it.
  - name: causes
    domain: CardiovascularDisease
    range: CardiovascularEvent
    description: Links a disease to potential outcomes or events.
  - name: subclassOf
    domain: null
    range: null
    description: General subclass relationship (OWL built-in, but declared for completeness).

  # --- Medication Relationships ---
  - name: interactsWith
    domain: CardiovascularMedication
    range: CardiovascularMedication
    description: Indicates drug interactions between medications.
  - name: hasAdverseEffect
    domain: CardiovascularMedication
    range: CardiovascularSymptom
    description: Links medications to their potential adverse effects.

# This section defines the Datatype Properties (attributes) of the ontology.
data_properties:
  # --- General Metadata ---
  - name: hasSnomedId
    domain: null # Applies to any class linked to SNOMED
    range: string
    description: SNOMED CT identifier for a concept.
  - name: hasDescription
    domain: null
    range: string
    description: Human-readable description of a concept.

  # --- Cardiovascular Attributes ---
  - name: hasSeverity
    domain: CardiovascularDisease
    range: string
    description: Severity level of a cardiovascular condition (e.g., 'mild', 'moderate', 'severe').
  - name: hasStage
    domain: CardiovascularDisease
    range: string
    description: Stage or classification of a disease (e.g., 'Stage A', 'NYHA Class II').
  - name: hasPrognosis
    domain: CardiovascularDisease
    range: string
    description: Prognostic information for a condition.
  - name: hasPrevalence
    domain: CardiovascularDisease
    range: string
    description: Prevalence information for a condition.

  # --- Medication Attributes ---
  - name: hasDosage
    domain: CardiovascularMedication
    range: string
    description: Standard dosage information for a medication.
  - name: hasIndication
    domain: CardiovascularMedication
    range: string
    description: Clinical indications for using a medication.
  - name: hasContraindication
    domain: CardiovascularMedication
    range: string
    description: Contraindications for a medication.

  # --- Biomarker Attributes ---
  - name: hasNormalRange
    domain: CardiacBiomarker
    range: string
    description: Normal reference range for a biomarker.
  - name: hasUnits
    domain: CardiacBiomarker
    range: string
    description: Units of measurement for a biomarker.

  # --- Risk Factor Attributes ---
  - name: hasRelativeRisk
    domain: CardiovascularRiskFactor
    range: string
    description: Relative risk associated with a risk factor.