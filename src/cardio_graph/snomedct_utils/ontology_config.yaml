# Configuration for the Cardio Ontology Generator
# This file defines the T-Box (schema) and parameters for the A-Box (data) population.

# These are the high-level categories we will try to sort SNOMED concepts into.
snomed_categories:
  - ClinicalAction
  - PatientPhenotype
  - Purpose
  - WorkflowStep
  - Guideline
  - EvidenceSource
  - Medication
  - Condition
  - GuidelineRecommendation
  - GuidelineSource

# Keyword lists for the fallback 'keyword' categorization method.
snomed_keywords:
  ClinicalAction:
    - procedure
    - therapy
    - treatment
    - examination
    - assessment
    - monitoring
    - administration
    - prescription
    - intervention
  PatientPhenotype:
    - finding
    - disorder
    - disease
    - syndrome
    - condition
    - symptom
    - sign
    - observation
    - measurement
    - test result
  Purpose:
    - goal
    - target
    - objective
    - purpose
    - aim
    - intended
    - indication
  WorkflowStep:
    - protocol
    - step
    - stage
    - phase
    - pathway
    - regimen
    - algorithm
  Guideline:
    - guideline
    - recommendation
    - protocol
    - consensus
    - standard
    - best practice
    - statement
  EvidenceSource:
    - trial
    - study
    - evidence
    - publication
    - literature
    - research
    - meta-analysis
  Medication:
    - medication
    - drug
    - pharmaceutical
    - pill
    - tablet
    - capsule
    - injection
    - infusion
    - anticoagulant
    - statin
    - beta blocker
    - ace inhibitor
    - antiplatelet
    - diuretic
  Condition:
    - disease
    - disorder
    - syndrome
    - condition
    - pathology
    - abnormality
    - deficiency
    - stenosis
    - insufficiency
    - failure

# This section defines the core schema (T-Box) of the ontology.
# The new 'snomed_search_terms' key guides the intelligent, schema-aware extraction from SNOMED CT.
core_classes:
  # --- Abstract / Structural Classes (Generally no search terms) ---
  - name: ClinicalWorkflow
    description: Represents a multi-step clinical process from guidelines.
    # We find examples of workflows, not the concept of a workflow itself.
    snomed_search_terms:
      - "protocol"
      - "pathway"
      - "algorithm"
      - "regimen"
  - name: WorkflowStep
    description: Represents a single step in a clinical workflow.
    # This is a structural element we create; not found in SNOMED.
  - name: Purpose
    description: The reason or goal for a clinical action.
    # This is a structural element we infer from text; not found in SNOMED.
  - name: LogicalJunction
    description: Abstract node to represent logical groupings.
    # This is a structural element we create; not found in SNOMED.
  - name: Conjunction
    description: Logical AND grouping of conditions.
    # This is a structural element we create; not found in SNOMED.
  - name: Disjunction
    description: Logical OR grouping of conditions.
    # This is a structural element we create; not found in SNOMED.
  - name: QuantitativePhenotype
    description: A structured way to represent values with operators.
    # This is a structural element we create; not found in SNOMED.
  - name: EvidenceStatement
    description: Reified node representing a claim or recommendation.
    # This is a structural element we create; not found in SNOMED.
  - name: EvidenceSource
    description: Source of clinical evidence.
    snomed_search_terms:
      - "clinical trial"
      - "randomized controlled trial"
      - "meta-analysis"
      - "observational study"
  - name: ContrastingStatement
    description: Special type of evidence statement used for contrasting patterns.
    # This is a structural element we create; not found in SNOMED.
  - name: Guideline
    description: A clinical guideline document.
    snomed_search_terms:
      - "guideline"
      - "consensus document"
      - "recommendation for"
  - name: Recommendation
    description: A specific recommendation within a guideline.
    # This is a structural element we create; not found in SNOMED.
  - name: GuidelineRecommendation
    description: Formal recommendation from a clinical guideline.
    # This is a structural element we create; not found in SNOMED.
  - name: GuidelineSource
    description: Source of a clinical guideline or recommendation.
    # This is a structural element we create; not found in SNOMED.

  # --- Concrete Clinical Concept Classes (Rich with search terms) ---
  - name: PatientPhenotype
    description: Observable characteristic of a patient.
    snomed_search_terms:
      - "finding"
      - "symptom"
      - "sign"
      - "history of"
      - "comorbidity"
      - "measurement"
  - name: Medication
    description: Pharmaceutical treatment or therapy.
    # This class is a parent; the specific therapy subclasses below are more useful for searching.
  - name: Condition
    description: Medical condition or disease state.
    snomed_search_terms:
      - "disease"
      - "disorder"
      - "syndrome"
      - "failure"
      - "insufficiency"
      - "stenosis"
      - "pathology"
  - name: CardiovascularDisease
    description: Diseases affecting the heart and blood vessels.
    snomed_search_terms:
      - "myocardial infarction"
      - "heart failure"
      - "atrial fibrillation"
      - "coronary artery disease"
      - "hypertension"
      - "ischemic heart disease"
      - "valvular heart disease"
  - name: ClinicalAction
    description: A specific clinical action to be taken.
    snomed_search_terms:
      - "procedure"
      - "intervention"
      - "administration of"
      - "assessment"
      - "monitoring"
  - name: CardiacImaging
    description: Diagnostic imaging procedures for the heart.
    snomed_search_terms:
      - "echocardiography"
      - "cardiac magnetic resonance"
      - "cardiac MRI"
      - "coronary angiography"
      - "computed tomography of heart"
  - name: CardiacBiomarker
    description: Laboratory tests used to diagnose cardiac conditions.
    snomed_search_terms:
      - "troponin"
      - "natriuretic peptide"
      - "BNP"
      - "creatine kinase-MB"
  - name: CardiacRiskFactor
    description: Factors that increase risk of cardiovascular disease.
    snomed_search_terms:
      - "hypertension"
      - "hyperlipidemia"
      - "diabetes mellitus"
      - "tobacco smoking"
      - "obesity"
      - "family history of cardiovascular disease"
  - name: RiskStratification
    description: Method for categorizing patient risk levels.
    snomed_search_terms:
      - "risk score"
      - "risk assessment"
      - "prognostic model"
      - "GRACE risk score"
      - "CHA2DS2-VASc"
  - name: CardiacDevice
    description: Medical devices used in cardiovascular care.
    snomed_search_terms:
      - "pacemaker"
      - "implantable cardioverter-defibrillator"
      - "ICD"
      - "coronary stent"
      - "ventricular assist device"
  - name: CardiacProcedure
    description: Interventional procedures on the heart.
    snomed_search_terms:
      - "percutaneous coronary intervention"
      - "PCI"
      - "coronary artery bypass grafting"
      - "CABG"
      - "catheter ablation"
      - "valve replacement"
  - name: AnticoagulationTherapy
    description: Therapy to prevent blood clotting.
    snomed_search_terms:
      - "anticoagulant"
      - "heparin"
      - "warfarin"
      - "apixaban"
      - "rivaroxaban"
      - "dabigatran"
      - "edoxaban"
  - name: AntiplateletTherapy
    description: Therapy to prevent platelet aggregation.
    snomed_search_terms:
      - "antiplatelet"
      - "aspirin"
      - "clopidogrel"
      - "ticagrelor"
      - "prasugrel"
  - name: LipidLoweringTherapy
    description: Therapy to reduce lipid levels.
    snomed_search_terms:
      - "statin"
      - "atorvastatin"
      - "rosuvastatin"
      - "simvastatin"
      - "ezetimibe"
      - "PCSK9 inhibitor"
  - name: AntihypertensiveTherapy
    description: Therapy to reduce blood pressure.
    snomed_search_terms:
      - "beta blocker"
      - "ace inhibitor"
      - "angiotensin receptor blocker"
      - "ARB"
      - "calcium channel blocker"
      - "diuretic"
  - name: HeartFailureTherapy
    description: Therapy specific to heart failure.
    snomed_search_terms:
      - "sacubitril / valsartan"
      - "ARNI"
      - "SGLT2 inhibitor"
      - "dapagliflozin"
      - "empagliflozin"
      - "mineralocorticoid receptor antagonist"
      - "MRA"
      - "ivabradine"
  - name: EmergencyCardiacCare
    description: Immediate interventions for cardiac emergencies.
    snomed_search_terms:
      - "cardiopulmonary resuscitation"
      - "CPR"
      - "defibrillation"
      - "advanced cardiac life support"
  - name: CardiacRehabilitation
    description: Structured program for cardiac recovery.
    snomed_search_terms:
      - "cardiac rehabilitation"
      - "exercise training for heart disease"
  - name: PreventiveCardiology
    description: Approaches to prevent cardiovascular disease.
    snomed_search_terms:
      - "primary prevention of cardiovascular disease"
      - "secondary prevention of cardiovascular disease"

# This section defines the Object Properties (relationships) of the ontology.
core_properties:
  - name: hasStep
    domain: ClinicalWorkflow
    range: WorkflowStep
    description: Relates a clinical workflow to its constituent steps
  # ... (rest of the core_properties section remains exactly the same as you provided)
  - name: hasAction
    domain: WorkflowStep
    range: ClinicalAction
    description: Relates a workflow step to the actions to be performed
  - name: hasPurpose
    domain: ClinicalAction
    range: Purpose
    description: Relates a clinical action to its intended purpose
  - name: requiresCondition
    domain: ClinicalAction
    range: null
    description: Links an action to a condition that must be met
  - name: hasOperand
    domain: LogicalJunction
    range: null
    description: Links a logical junction to its operands
  - name: contrastsWith
    domain: EvidenceStatement
    range: ContrastingStatement
    description: Links an evidence statement to a contrasting statement
  - name: isSupportedBy
    domain: EvidenceStatement
    range: EvidenceSource
    description: Links an evidence statement to its supporting source
  - name: isRecommendedIn
    domain: ClinicalAction
    range: Guideline
    description: Indicates the guideline in which an action is recommended
  - name: hasRecommendation
    domain: Guideline
    range: Recommendation
    description: Links a guideline to its recommendations
  - name: hasEvidenceLevel
    domain: Recommendation
    range: EvidenceLevel
    description: Specifies the evidence level for a recommendation
  - name: hasIndication
    domain: Medication
    range: Condition
    description: Links a medication to a condition it is indicated for
  - name: isRecommendedFor
    domain: Medication
    range: PatientPhenotype
    description: Links a medication to a patient phenotype for which it is recommended
  - name: isContraindicatedIn
    domain: Medication
    range: Condition
    description: Links a medication to a condition in which it is contraindicated
  - name: hasSource
    domain: GuidelineRecommendation
    range: GuidelineSource
    description: Links a guideline recommendation to its source
  - name: makesRecommendation
    domain: GuidelineSource
    range: GuidelineRecommendation
    description: Links a guideline source to a recommendation it makes
  - name: interactsWith
    domain: Medication
    range: Medication
    description: Indicates that two medications have a drug interaction
  - name: hasInteractionSeverity
    domain: interactsWith
    range: null
    description: Severity level of a drug interaction (property of a property)
  - name: treats
    domain: ClinicalAction
    range: Condition
    description: Indicates that a clinical action treats a condition
  - name: prevents
    domain: ClinicalAction
    range: Condition
    description: Indicates that a clinical action prevents a condition
  - name: diagnoses
    domain: ClinicalAction
    range: Condition
    description: Indicates that a clinical action diagnoses a condition
  - name: hasAlternative
    domain: Medication
    range: Medication
    description: Indicates an alternative medication that can be used
  - name: hasPrecondition
    domain: ClinicalAction
    range: PatientPhenotype
    description: Patient condition that must be present before the action
  - name: hasFollowUp
    domain: ClinicalAction
    range: ClinicalAction
    description: Indicates a follow-up action that should be performed
  - name: isAdministeredWith
    domain: Medication
    range: Medication
    description: Medications that are typically administered together
  - name: isContraryTo
    domain: Recommendation
    range: Recommendation
    description: Indicates that two recommendations contradict each other
  - name: supersedes
    domain: Guideline
    range: Guideline
    description: Indicates that a guideline supersedes an older one

# This section defines the Datatype Properties (attributes) of the ontology.
data_properties:
  - name: hasSnomedId
    domain: null
    range: string
    description: SNOMED CT identifier for a concept
  # ... (rest of the data_properties section remains exactly the same as you provided)
  - name: hasRxNormId
    domain: Medication
    range: string
    description: RxNorm identifier for a medication
  - name: hasDosage
    domain: Medication
    range: string
    description: Dosage information for a medication
  - name: hasEvidenceLevelString
    domain: Recommendation
    range: string
    description: Evidence level as a string (e.g., 'Class I, Level A')
  - name: pageNumber
    domain: null
    range: integer
    description: Page number where content appears in a guideline document
  - name: hasFrequency
    domain: ClinicalAction
    range: string
    description: Frequency of a clinical action (e.g., 'daily', 'twice daily')
  - name: hasAdverseEffect
    domain: Medication
    range: string
    description: Common adverse effect of a medication
  - name: hasConcentration
    domain: Medication
    range: string
    description: Concentration or strength of a medication
  - name: hasPrevalence
    domain: Condition
    range: string
    description: Prevalence of a condition in the population
  - name: hasPriority
    domain: ClinicalAction
    range: integer
    description: Priority level of a clinical action (1=highest)
  - name: hasEffectiveDate
    domain: Guideline
    range: date
    description: Date when the guideline became effective
  - name: hasReference
    domain: EvidenceStatement
    range: string
    description: Bibliographic reference for an evidence statement

# --- Sections for defining individuals (A-Box instances) ---

recommendation_levels:
  - id: ClassI
    description: Class I - Evidence and/or general agreement that a treatment is beneficial, useful, effective
    short_definition: Strong recommendation for an intervention
  # ... (rest of recommendation_levels remains the same)
  - id: ClassIIa
    description: Class IIa - Weight of evidence in favor of usefulness/efficacy
    short_definition: Moderate recommendation in favor of intervention
  - id: ClassIIb
    description: Class IIb - Usefulness/efficacy less well established
    short_definition: Weak recommendation in favor of intervention
  - id: ClassIII
    description: Class III - Evidence that treatment is not useful/effective and may be harmful
    short_definition: Recommendation against intervention

evidence_qualities:
  - id: LevelA
    description: Level A - Data derived from multiple randomized clinical trials or meta-analyses
    short_definition: High quality
  # ... (rest of evidence_qualities remains the same)
  - id: LevelB
    description: Level B - Data derived from a single randomized clinical trial or large non-randomized studies
    short_definition: Moderate quality
  - id: LevelC
    description: Level C - Consensus of opinion of the experts and/or small studies, retrospective studies, registries
    short_definition: Low quality

combined_levels:
  - id: ClassI_LevelA
    label: Class I, Level A
    recommendation_class: ClassI
    evidence_quality: LevelA
  # ... (rest of combined_levels remains the same)
  - id: ClassI_LevelB
    label: Class I, Level B
    recommendation_class: ClassI
    evidence_quality: LevelB
  - id: ClassI_LevelC
    label: Class I, Level C
    recommendation_class: ClassI
    evidence_quality: LevelC
  - id: ClassIIa_LevelA
    label: Class IIa, Level A
    recommendation_class: ClassIIa
    evidence_quality: LevelA
  - id: ClassIIa_LevelB
    label: Class IIa, Level B
    recommendation_class: ClassIIa
    evidence_quality: LevelB
  - id: ClassIIa_LevelC
    label: Class IIa, Level C
    recommendation_class: ClassIIa
    evidence_quality: LevelC
  - id: ClassIIb_LevelA
    label: Class IIb, Level A
    recommendation_class: ClassIIb
    evidence_quality: LevelA
  - id: ClassIIb_LevelB
    label: Class IIb, Level B
    recommendation_class: ClassIIb
    evidence_quality: LevelB
  - id: ClassIIb_LevelC
    label: Class IIb, Level C
    recommendation_class: ClassIIb
    evidence_quality: LevelC
  - id: ClassIII_LevelA
    label: Class III, Level A
    recommendation_class: ClassIII
    evidence_quality: LevelA
  - id: ClassIII_LevelB
    label: Class III, Level B
    recommendation_class: ClassIII
    evidence_quality: LevelB
  - id: ClassIII_LevelC
    label: Class III, Level C
    recommendation_class: ClassIII
    evidence_quality: LevelC