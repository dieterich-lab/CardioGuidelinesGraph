# Configuration for the Cardio Ontology Generator
# This file defines the T-Box (schema) and parameters for the A-Box (data) population.

# These are the high-level categories we will try to sort SNOMED concepts into.
snomed_categories:
  - ClinicalAction
  - PatientPhenotype
  - Purpose
  - WorkflowStep
  - Guideline
  - EvidenceSource
  - Medication
  - Condition
  - GuidelineRecommendation
  - GuidelineSource

# Keyword lists for the fallback 'keyword' categorization method.
snomed_keywords:
  ClinicalAction:
    - procedure
    - therapy
    - treatment
    - examination
    - assessment
    - monitoring
    - administration
    - prescription
    - intervention
  PatientPhenotype:
    - finding
    - disorder
    - disease
    - syndrome
    - condition
    - symptom
    - sign
    - observation
    - measurement
    - test result
  Purpose:
    - goal
    - target
    - objective
    - purpose
    - aim
    - intended
    - indication
  WorkflowStep:
    - treatment protocol
    - step
    - stage
    - phase
    - clinical pathway
    - regimen
    - algorithm
  Guideline:
    - guideline
    - recommendation
    - protocol
    - consensus
    - standard
    - best practice
    - statement
  EvidenceSource:
    - trial
    - study
    - evidence
    - publication
    - literature
    - research
    - meta-analysis
  Medication:
    - medication
    - drug
    - pharmaceutical
    - pill
    - tablet
    - capsule
    - injection
    - infusion
    - anticoagulant
    - statin
    - beta blocker
    - ace inhibitor
    - antiplatelet
    - diuretic
  Condition:
    - disease
    - disorder
    - syndrome
    - condition
    - pathology
    - abnormality
    - deficiency
    - stenosis
    - insufficiency
    - failure

# This section defines the core schema (T-Box) of the ontology.
# The new 'snomed_search_terms' key guides the intelligent, schema-aware extraction from SNOMED CT.
ontology_classes:
  # --- Abstract / Structural Classes ---
  - name: ClinicalWorkflow
    description: Represents a multi-step clinical process from guidelines.
    snomed_search_terms:
      - "treatment protocol"
      - "clinical pathway"
      - "management algorithm"
  - name: WorkflowStep
    description: Represents a single step in a clinical workflow.
  - name: Purpose
    description: The reason or goal for a clinical action.
  - name: LogicalJunction
    description: Abstract node to represent logical groupings.
  - name: Conjunction
  description: Logical AND grouping of conditions.
  subclass_of: LogicalJunction
  - name: Disjunction
  description: Logical OR grouping of conditions.
  subclass_of: LogicalJunction
  - name: QuantitativePhenotype
    description: A structured way to represent a clinical value with an operator (e.g., LVEF < 40%).
  - name: EvidenceStatement
    description: The parent class for any claim, finding, or statement made in a text. This is the core node for reification.
    snomed_search_terms:
      - "finding"
      - "evidence"
      - "observation"
  - name: GuidelineRecommendation
    ## REFINEMENT: This is now a more specific *type* of EvidenceStatement, not a separate top-level concept.
    ## This makes the model more logical. A recommendation IS a type of statement.
  description: A formal recommendation from a clinical guideline. A subclass of EvidenceStatement.
  subclass_of: EvidenceStatement
  - name: ContrastingStatement
  description: An evidence statement used to present contrasting or nuanced findings. A subclass of EvidenceStatement.
  subclass_of: EvidenceStatement
  - name: EvidenceSource
    description: Source of clinical evidence, like a clinical trial or meta-analysis.
    snomed_search_terms:
      - "clinical trial"
      - "meta-analysis"
      - "observational study"
  - name: GuidelineSource
    description: The guideline document itself.
    snomed_search_terms:
      - "guideline"
      - "consensus document"
  - name: DosageInstruction
    description: A structured representation of medication dosage, including titration and adjustments.
    snomed_search_terms:
      - "dosage"
      - "dosing"
      - "titration"
  - name: TreatmentGoal
    description: A specific therapeutic target or goal for a patient or condition (e.g., target blood pressure).
    snomed_search_terms:
      - "target"
      - "goal"
      - "therapeutic objective"
  - name: PatientPhenotype
    description: An observable characteristic of a patient (e.g., a symptom, sign, comorbidity).
    snomed_search_terms:
      - "finding"
      - "symptom"
      - "sign"
      - "history of"
  - name: Medication
    description: A specific drug or a class of drugs.
    # The subclasses below provide more specific search terms.
  - name: Condition
    description: A medical disease, disorder, or diagnosis.
    snomed_search_terms:
      - "disease"
      - "disorder"
      - "syndrome"
      - "failure"
  - name: CardiovascularDisease
  description: Diseases affecting the heart and blood vessels. A subclass of Condition.
  subclass_of: Condition
    snomed_search_terms:
      - "myocardial infarction"
      - "heart failure"
      - "atrial fibrillation"
      - "coronary artery disease"
  - name: ClinicalAction
    description: A specific action to be taken (e.g., a procedure, test, or therapy administration).
    snomed_search_terms:
      - "procedure"
      - "intervention"
      - "assessment"
      - "monitoring"
  - name: CardiacImaging
  description: Diagnostic imaging procedures for the heart. A subclass of ClinicalAction.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "echocardiography"
      - "cardiac magnetic resonance"
      - "coronary angiography"
  # ... (The rest of your excellent, detailed clinical classes remain the same) ...
  - name: CardiacBiomarker
    description: Laboratory tests used to diagnose cardiac conditions.
    snomed_search_terms:
      - "troponin"
      - "natriuretic peptide"
  - name: CardiacRiskFactor
  description: Factors that increase risk of cardiovascular disease. A subclass of PatientPhenotype.
  subclass_of: PatientPhenotype
    snomed_search_terms:
      - "hypertension"
      - "hyperlipidemia"
      - "diabetes mellitus"
  - name: CardiacBiomarker
    description: Laboratory tests used to diagnose cardiac conditions.
    snomed_search_terms:
      - "troponin"
      - "natriuretic peptide"
      - "BNP"
      - "creatine kinase-MB"
  - name: CardiacRiskFactor
  # DUPLICATE WARNING: This second definition duplicates 'CardiacRiskFactor'. Consider removing.
  description: Factors that increase risk of cardiovascular disease.
  subclass_of: PatientPhenotype
    snomed_search_terms:
      - "hypertension"
      - "hyperlipidemia"
      - "diabetes mellitus"
      - "tobacco smoking"
      - "obesity"
      - "family history of cardiovascular disease"
  - name: RiskStratification
    description: Method for categorizing patient risk levels.
    snomed_search_terms:
      - "risk score"
      - "risk assessment"
      - "prognostic model"
      - "GRACE risk score"
      - "CHA2DS2-VASc"
  - name: CardiacDevice
    description: Medical devices used in cardiovascular care.
    snomed_search_terms:
      - "pacemaker"
      - "implantable cardioverter-defibrillator"
      - "ICD"
      - "coronary stent"
      - "ventricular assist device"
  - name: CardiacProcedure
    description: Interventional procedures on the heart.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "percutaneous coronary intervention"
      - "PCI"
      - "coronary artery bypass grafting"
      - "CABG"
      - "catheter ablation"
      - "valve replacement"
  - name: AnticoagulationTherapy
    description: Therapy to prevent blood clotting.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "anticoagulant"
      - "heparin"
      - "warfarin"
      - "apixaban"
      - "rivaroxaban"
      - "dabigatran"
      - "edoxaban"
  - name: AntiplateletTherapy
    description: Therapy to prevent platelet aggregation.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "antiplatelet"
      - "aspirin"
      - "clopidogrel"
      - "ticagrelor"
      - "prasugrel"
  - name: LipidLoweringTherapy
    description: Therapy to reduce lipid levels.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "statin"
      - "atorvastatin"
      - "rosuvastatin"
      - "simvastatin"
      - "ezetimibe"
      - "PCSK9 inhibitor"
  - name: AntihypertensiveTherapy
    description: Therapy to reduce blood pressure.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "beta blocker"
      - "ace inhibitor"
      - "angiotensin receptor blocker"
      - "ARB"
      - "calcium channel blocker"
      - "diuretic"
  - name: HeartFailureTherapy
    description: Therapy specific to heart failure.
  subclass_of: ClinicalAction
    snomed_search_terms:
      - "sacubitril / valsartan"
      - "ARNI"
      - "SGLT2 inhibitor"
      - "dapagliflozin"
      - "empagliflozin"
      - "mineralocorticoid receptor antagonist"
      - "MRA"
      - "ivabradine"
  - name: EmergencyCardiacCare
    description: Immediate interventions for cardiac emergencies.
  subclass_of: ClinicalWorkflow
    snomed_search_terms:
      - "cardiopulmonary resuscitation"
      - "CPR"
      - "defibrillation"
      - "advanced cardiac life support"
  - name: CardiacRehabilitation
    description: Structured program for cardiac recovery.
  subclass_of: ClinicalWorkflow
    snomed_search_terms:
      - "cardiac rehabilitation"
      - "exercise training for heart disease"
  - name: PreventiveCardiology
    description: Approaches to prevent cardiovascular disease.
  subclass_of: ClinicalWorkflow
    snomed_search_terms:
      - "primary prevention of cardiovascular disease"
      - "secondary prevention of cardiovascular disease"

# This section defines the Object Properties (relationships) of the ontology.
core_properties:
  # --- Workflow & Action Properties ---
  - name: hasStep
    domain: ClinicalWorkflow
    range: WorkflowStep
    description: Relates a clinical workflow to its constituent steps.
  - name: hasAction
    domain: WorkflowStep
    range: ClinicalAction
    description: Relates a workflow step to the actions to be performed.
  - name: hasPurpose
    domain: ClinicalAction
    range: Purpose
    description: Relates a clinical action to its intended purpose.
  - name: hasFollowUp
    domain: ClinicalAction
    range: ClinicalAction
    description: Indicates a follow-up action that should be performed.

  # --- Logical & Conditional Properties ---
  - name: appliesWhen
    domain: EvidenceStatement # Actions and Recommendations are now Statements
    range: null # Can be PatientPhenotype or LogicalJunction
    description: Links a statement or action to the condition(s) under which it applies.
  - name: hasOperand
    domain: LogicalJunction
    range: PatientPhenotype # Making the range more specific
    description: Links a logical junction to its constituent patient phenotypes or conditions.

  # --- Evidence & Provenance Properties ---
  - name: isSupportedBy
    domain: EvidenceStatement
    range: EvidenceSource
    description: Links a statement to its supporting evidence source (e.g., a trial).
  - name: isStatedIn
    domain: EvidenceStatement
    range: GuidelineSource
    description: Links a statement to the guideline document it comes from.
  - name: contrastsWith
    domain: EvidenceStatement
    range: ContrastingStatement
    description: Links an evidence statement to a contrasting or nuanced finding.

  # --- Recommendation & Treatment Properties ---
  - name: recommends
    domain: GuidelineRecommendation
    range: ClinicalAction
    description: Indicates the action or treatment that is being recommended.
  - name: hasIndication
    domain: Medication
    range: Condition
    description: Links a medication to a condition it is officially indicated for.
  - name: isContraindicatedIn
    domain: Medication
    range: Condition
    description: Links a medication to a condition in which it is contraindicated.
  - name: hasAlternative
    domain: ClinicalAction # Generalizing from Medication to any Action
    range: ClinicalAction
    description: Indicates an alternative action or medication that can be used.
  - name: hasTreatmentGoal
    ## REFINEMENT: New property to link a recommendation to our new TreatmentGoal class.
    domain: GuidelineRecommendation
    range: TreatmentGoal
    description: Specifies the therapeutic target or goal of a recommendation.

  # --- Medication-Specific Properties ---
  - name: hasDosageInstruction
    domain: Medication
    range: DosageInstruction
    description: Links a medication to its structured dosage instructions.
  - name: interactsWith
    domain: Medication
    range: Medication
    description: Indicates that two medications have a drug interaction.
  - name: isAdministeredWith
    domain: Medication
    range: Medication
    description: Indicates that two medications are typically administered together.

# This section defines the Datatype Properties (attributes) of the ontology.
data_properties:
  # --- General Metadata ---
  - name: hasSnomedId
    domain: null # Applies to any individual linked to SNOMED
    range: string
    description: SNOMED CT identifier for a concept.
  - name: hasSourceText
    ## REFINEMENT: Renamed from 'hasReference' for clarity. Stores the direct text snippet.
    domain: EvidenceStatement
    range: string
    description: The literal text snippet from the guideline that supports the statement.
  - name: pageNumber
    domain: GuidelineSource
    range: integer
    description: Page number where content appears in a guideline document.
  - name: hasEvidenceLevel
    ## REFINEMENT: This is an attribute of a recommendation, linking to a literal string.
    domain: GuidelineRecommendation
    range: string
    description: Evidence level as a string (e.g., 'Class I, Level A').

  # --- DosageInstruction Attributes (used by our new class) ---
  - name: hasInitialDose
    domain: DosageInstruction
    range: string
    description: The starting dose of a medication (e.g., '2.5 mg daily').
  - name: hasTargetDose
    domain: DosageInstruction
    range: string
    description: The target or maximum dose of a medication (e.g., '10 mg daily').
  - name: hasTitrationSchedule
    domain: DosageInstruction
    range: string
    description: Instructions for how to increase the dose over time (e.g., 'double dose every 2 weeks').
  - name: hasAdjustmentInstruction
    domain: DosageInstruction
    range: string
    description: Instructions for dose adjustments based on conditions (e.g., 'reduce by 50% if eGFR < 30').

  # --- TreatmentGoal Attributes (used by our new class) ---
  - name: hasTargetValue
    domain: TreatmentGoal
    range: string # Could also be float/integer depending on desired complexity
    description: The target value for a clinical measurement (e.g., '130' for systolic BP).
  - name: hasTargetOperator
    domain: TreatmentGoal
    range: string
    description: The operator for the target (e.g., '<', '<=').
  - name: hasTargetUnit
    domain: TreatmentGoal
    range: string
    description: The unit for the target value (e.g., 'mmHg', 'mg/dL').

  # --- Other Clinical Attributes ---
  - name: hasFrequency
    domain: ClinicalAction
    range: string
    description: Frequency of a clinical action (e.g., 'daily', 'twice daily').
  - name: hasAdverseEffect
    domain: Medication
    range: string
    description: A common adverse effect of a medication.